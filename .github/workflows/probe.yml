name: probe-live
on:
  push:
    branches: [claude/project-thread-ism3jz]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://wu-ting-yen.github.io"
          curl -s -H "$O" "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/USS:AAPL:STOCK,USS:MSFT:STOCK,USS:GOOG:STOCK,USS:NVDA:STOCK,USS:AMZN:STOCK,USS:SPCX:STOCK,USS:TSM:STOCK,USS:AVGO:STOCK,USS:META:STOCK,USS:TSLA:STOCK?column=G" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['statusCode'],d['message']);[print(x['0'],x.get('6'),x.get('56'),x.get('200007')) for x in (d['data'] or [])]"
          curl -s -H "$O" "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/USS:SPCX:STOCK?column=G" | head -c 300; echo
          for s in GI:SOX:INDEX GI:INX:INDEX GI:GSPC:INDEX GI:SPX500:INDEX GI:VIX:INDEX; do echo "== $s"; curl -s -H "$O" "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/$s?column=G" | head -c 200; echo; done
