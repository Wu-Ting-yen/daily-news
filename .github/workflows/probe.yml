name: probe-live
on:
  push:
    branches: [claude/project-thread-ism3jz]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,time,urllib.request
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Origin":"https://wu-ting-yen.github.io"}),timeout=15))
          for k in range(6):
              now=time.time()
              c=get("https://ws.api.cnyes.com/ws/api/v1/quote/quotes/TWS:2330:STOCK,TWS:2317:STOCK,TWS:8069:STOCK,TWS:TSE01:INDEX?column=G")["data"]
              m=get("https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw|tse_2317.tw|otc_8069.tw&json=1&delay=0")["msgArray"]
              mm={x["c"]:x for x in m}
              for x in c:
                  code=x["200010"]; t=mm.get(code,{})
                  mt=int(t.get("tlong",0))/1000 if t else 0
                  print(k,code,"cnyes",x["6"],"age",round(now-x["200007"]),"s | mis",t.get("z"),t.get("%"),"age",round(now-mt) if mt else "-")
              time.sleep(10)
          PY
          python3 p.py
