name: probe-live
on:
  push:
    branches: [claude/project-thread-ism3jz]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://wu-ting-yen.github.io"
          echo "=== cnyes TW listed + otc + US"
          curl -s -D - -H "$O" "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/TWS:2330:STOCK,TWS:8069:STOCK,TWG:8069:STOCK,USS:AAPL:STOCK,USS:TSM:STOCK,USS:GOOG:STOCK?column=G" | head -c 6000; echo
          echo "=== cnyes column=K"
          curl -s -H "$O" "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/USS:AAPL:STOCK?column=K" | head -c 3000; echo
          echo "=== TV america"
          curl -s -D - -H "$O" -H "Content-Type: text/plain;charset=UTF-8" -X POST "https://scanner.tradingview.com/america/scan" --data '{"symbols":{"tickers":["NASDAQ:AAPL","NYSE:TSM","NASDAQ:GOOG"]},"columns":["name","close","change","change_abs","volume","update_mode","premarket_close","postmarket_close","postmarket_change","market_session","time","description"]}' | head -c 3000; echo
          echo "=== TV taiwan"
          curl -s -H "$O" -H "Content-Type: text/plain;charset=UTF-8" -X POST "https://scanner.tradingview.com/taiwan/scan" --data '{"symbols":{"tickers":["TWSE:2330","TPEX:8069","TWSE:2317"]},"columns":["name","close","change","change_abs","volume","update_mode","description"]}' | head -c 3000; echo
          echo "=== TV preflight"
          curl -s -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "https://scanner.tradingview.com/taiwan/scan" | grep -i access
          echo "=== cnyes chart/intraday?"
          curl -s -D - -H "$O" "https://ws.api.cnyes.com/ws/api/v1/charting/history?resolution=1&symbol=TWS:2330:STOCK&quote=1" | head -c 1500; echo
