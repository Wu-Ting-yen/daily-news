name: 台股分析

on:
  schedule:
    - cron: "41 9 * * 1-5"   # 台北時間 週一到週五 17:41（法人資料公布後）
  workflow_dispatch:
  push:
    branches: [claude/project-thread-x3p1pk]
    paths: [screener.py, stocks_template.html, .github/workflows/stocks.yml]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 篩選股票、更新網頁、推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PUSH: ${{ github.event_name != 'push' && '1' || '0' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python screener.py
      - name: 儲存
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "台股分析 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
