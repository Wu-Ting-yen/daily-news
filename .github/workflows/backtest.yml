name: 融資流動性回測
on:
  workflow_dispatch:
    inputs:
      px_run:
        description: "股價資料的 run id"
        default: "44974846447"
      fund_run:
        description: "財報資料的 run id"
        default: "44977264084"
  push:
    branches: [claude/project-thread-x3p1pk]
    paths: [backtest/RUN]
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bt-px
          path: bt_raw
          run-id: ${{ inputs.px_run || '44974846447' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bt-fund-*
          path: bt_raw
          merge-multiple: true
          run-id: ${{ inputs.fund_run || '44977264084' }}
          github-token: ${{ github.token }}
      - run: python backtest/fetch_market.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: 補最近的融資資料
        run: python backtest/margin_hist.py "$(TZ=Asia/Taipei date -d '-10 days' +%F)" "$(TZ=Asia/Taipei date +%F)"
      - run: ls -la bt_raw && python backtest/run.py && python backtest/page.py
      - name: 儲存
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/bt/result.json data/bt/official.json data/bt/margin backtest.html
          git diff --cached --quiet && exit 0
          git commit -m "回測結果 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
