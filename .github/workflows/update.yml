name: 更新新聞

on:
  schedule:
      - cron: "5,35 * * * *"  # 每 30 分鐘（GitHub 定時功能）
  workflow_dispatch:                # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓新聞、更新網頁、推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python update.py
      - name: 外資持股頁（當天資料還沒齊就再抓一次）
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python - <<'PY' && python foreign.py || echo "外資持股：今天不用再抓"
          import datetime as dt, json, sys
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=8)))
          # 下午 3 點到半夜看今天；半夜到早上 9 點補看前一個交易日（持股比例有時很晚才公布）
          day = now.date() if now.hour >= 15 else now.date() - dt.timedelta(days=1)
          while day.weekday() > 4:
              day -= dt.timedelta(days=1)
          if 9 <= now.hour < 15 or (now.hour >= 15 and now.weekday() > 4):
              sys.exit(1)
          d = day.isoformat()
          daily = {r["d"] for r in json.load(open("data/foreign/daily.json"))}
          flow = json.load(open("data/foreign/flow.json"))
          sys.exit(0 if d not in daily or (flow.get(d) or {}).get("otc") is None else 1)
          PY
      - name: 融資資料（有新的一天就重算流動性回測頁）
        continue-on-error: true
        timeout-minutes: 6
        run: |
          read A B < <(python - <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=8)))
          if 9 <= now.hour < 15:
              print("- -")
          else:
              end = now.date() if now.hour >= 15 else now.date() - dt.timedelta(days=1)
              print((end - dt.timedelta(days=10)).isoformat(), end.isoformat())
          PY
          )
          [ "$A" = "-" ] && { echo "融資：白天不抓"; exit 0; }
          before=$(cat data/bt/margin/*.json | md5sum)
          GAP=1.5 python backtest/margin_hist.py "$A" "$B"
          after=$(cat data/bt/margin/*.json | md5sum)
          [ "$before" != "$after" ] && echo "BT_RERUN=1" >> "$GITHUB_ENV" || echo "融資：沒有新資料"
      - name: 儲存
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "更新新聞 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          for i in 1 2 3; do git push -q && break || git pull -q --rebase; done
      - name: 有新的融資資料就重算回測頁
        if: env.BT_RERUN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backtest.yml --ref main -R "${{ github.repository }}"
