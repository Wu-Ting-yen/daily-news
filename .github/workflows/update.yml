name: 更新新聞

on:
  schedule:
      - cron: "5,35 * * * *"  # 每 30 分鐘（GitHub 定時功能）
  workflow_dispatch:                # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓新聞、更新網頁、推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python update.py
      - name: 外資持股頁（當天資料還沒齊就再抓一次）
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python - <<'PY' && python foreign.py || echo "外資持股：今天不用再抓"
          import datetime as dt, json, sys
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=8)))
          # 下午 3 點到半夜看今天；半夜到早上 9 點補看前一個交易日（持股比例有時很晚才公布）
          day = now.date() if now.hour >= 15 else now.date() - dt.timedelta(days=1)
          while day.weekday() > 4:
              day -= dt.timedelta(days=1)
          if 9 <= now.hour < 15 or (now.hour >= 15 and now.weekday() > 4):
              sys.exit(1)
          d = day.isoformat()
          daily = {r["d"] for r in json.load(open("data/foreign/daily.json"))}
          flow = json.load(open("data/foreign/flow.json"))
          sys.exit(0 if d not in daily or (flow.get(d) or {}).get("otc") is None else 1)
          PY
      - name: 儲存
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "更新新聞 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          # 別的排程（台股分析、外資持股）也會改 foreign.html；撞到時以這次剛產生的版本為準，最多重試 5 次
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
