<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日財經新聞</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="財經新聞">
<meta name="theme-color" content="#0b1324">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7;--card:#ffffff;--text:#0f172a;--sub:#64748b;--line:#e6e8ee;
  --brand:#0b1324;--brand2:#1e2a47;--accent:#c8a45c;--hot:#e5484d;--hotbg:#fff1f1;
  --tab:#ffffff1a;--tabon:#c8a45c;--shadow:0 1px 2px #0f172a0d,0 4px 14px #0f172a0a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0f1c;--card:#121a2c;--text:#e8ecf4;--sub:#8b97ad;--line:#1f2a40;
  --hotbg:#2a1418;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter","Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
  font-size:16px;line-height:1.55;letter-spacing:.01em}
header{position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;
  padding:max(14px,env(safe-area-inset-top)) 0 0;box-shadow:0 2px 12px #0006}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px 10px}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.04em}
h1 span{color:var(--accent)}
.upd{font-size:12px;color:#ffffffa0;font-family:Inter,sans-serif}
nav{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:999px;padding:7px 14px;font:500 14px "Noto Sans TC",sans-serif;
  background:var(--tab);color:#ffffffd0;display:flex;gap:6px;align-items:center;cursor:pointer}
nav button b{font:600 11px Inter,sans-serif;background:#ffffff22;border-radius:999px;padding:1px 7px;color:#fff}
nav button.on{background:var(--tabon);color:var(--brand)}
nav button.on b{background:#0b132422;color:var(--brand)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
section{display:none}
section.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);
  margin-bottom:10px;overflow:hidden;position:relative}
.card.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hot)}
a{color:inherit;text-decoration:none}
.main{display:block;padding:14px 16px 12px}
.main:active,.rel:active{background:var(--line)}
h3{margin:0 0 8px;font-size:16.5px;font-weight:700;line-height:1.5}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.src{font-weight:500;color:var(--text);opacity:.75}
.meta time{font-family:Inter,sans-serif}
.meta time::before{content:"·";margin-right:8px}
details{border-top:1px solid var(--line)}
summary{list-style:none;padding:10px 16px;font-size:13px;color:var(--sub);cursor:pointer;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"展開 ›";color:var(--accent);font-weight:500}
details[open] summary::after{content:"收合 ˅"}
.rels{padding:0 16px 8px}
.rel{display:block;padding:10px 0 10px 12px;border-left:2px solid var(--line);font-size:14.5px}
.rel+.rel{border-top:1px dashed var(--line)}
.rel .meta{margin-top:4px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
#totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;
  border:0;background:var(--brand);color:#fff;font-size:20px;box-shadow:0 4px 14px #0005;opacity:0;pointer-events:none;transition:.2s}
#totop.show{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<header>
  <div class="top"><h1>每日<span>財經</span></h1><div class="upd">更新 {{UPDATED}}</div></div>
  <nav>{{NAV}}</nav>
</header>
<main>{{BODY}}</main>
<button id="totop" aria-label="回到頂端">↑</button>
<script>
(function(){
  var btns=[].slice.call(document.querySelectorAll('nav button'));
  var secs=[].slice.call(document.querySelectorAll('main section'));
  function show(id){
    btns.forEach(function(b){b.classList.toggle('on',b.dataset.tab===id)});
    secs.forEach(function(s){s.classList.toggle('on',s.id===id)});
    var b=btns.filter(function(x){return x.dataset.tab===id})[0];
    if(b) b.scrollIntoView({inline:'center',block:'nearest'});
    window.scrollTo(0,0);
    try{localStorage.setItem('tab',id)}catch(e){}
  }
  btns.forEach(function(b){b.onclick=function(){show(b.dataset.tab)}});
  var saved=null;try{saved=localStorage.getItem('tab')}catch(e){}
  show(location.hash.slice(1)||(saved&&document.getElementById(saved)?saved:'alerts'));
  // 相對時間：「12 分鐘前」
  var now=Date.now();
  document.querySelectorAll('time').forEach(function(t){
    var m=Math.round((now-new Date(t.getAttribute('datetime')))/60000);
    if(m<1) t.textContent='剛剛'; else if(m<60) t.textContent=m+' 分鐘前';
    else if(m<1440) t.textContent=Math.floor(m/60)+' 小時前';
  });
  var top=document.getElementById('totop');
  window.addEventListener('scroll',function(){top.classList.toggle('show',scrollY>600)},{passive:true});
  top.onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
})();
</script>
</body>
</html>
