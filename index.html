<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日財經新聞</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--hot:#dc2626;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--text:#e5e7eb;--muted:#94a3b8;--accent:#60a5fa;--hot:#f87171;--line:#232b42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.upd{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav a{flex:none;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
section{scroll-margin-top:110px}
h2{font-size:17px;margin:22px 0 8px}
.hot h2{color:var(--hot)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden}
li+li{border-top:1px solid var(--line)}
li a{display:block;padding:12px 14px;color:inherit;text-decoration:none}
li a:active{background:var(--line)}
.t{display:block;font-weight:600}
.m{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.m::after{content:""}
.empty{padding:12px 14px;color:var(--muted)}
</style>
</head>
<body>
<header>

  <nav><a href="#top">今日頭條</a><a href="#business">財經</a><a href="#tech">科技</a><a href="#world">國際</a><a href="#ipo">IPO 上市・定價</a><a href="#bigco">大公司動態</a><a href="#space">太空・發射</a><a href="#macro">央行・利率</a></nav>
</header>
